<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#CBA358" />
      <stop offset="100%" stop-color="#9E782E" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232A30" />
      <stop offset="100%" stop-color="#14181B" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#CBA358" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Outer Shield Crest -->
  <path d="M 64 22 
           C 78 22, 92 18, 92 18
           C 94 48, 92 78, 64 104
           C 36 78, 34 48, 36 18
           C 36 18, 50 22, 64 22 Z"
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Inner Razor & Scissors in Gold -->
  <g stroke="url(#shieldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Scissor Blade 1 & Handle -->
    <line x1="42" y1="86" x2="84" y2="38" stroke-width="4.5" />
    <circle cx="40" cy="90" r="8" stroke-width="3.5" />
    <circle cx="64" cy="59" r="2.5" fill="#CBA358" stroke="none" />

    <!-- Open Straight Razor (Navalha) -->
    <path d="M 88 88 L 68 64 L 54 44 C 52 38, 58 32, 66 38 L 84 56 Z" stroke-width="3.5" fill="#CBA358" fill-opacity="0.15" />
    <circle cx="88" cy="90" r="7" stroke-width="3.5" />
  </g>
</svg>
