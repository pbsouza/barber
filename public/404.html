<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucas Hoffmann Barber - Redirecionando...</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <script>
      // Single Page App redirect for GitHub Pages
      sessionStorage.redirect = location.href;
      var pathSegments = location.pathname.split('/');
      // If deployed in a GitHub project repo (/repo-name/), redirect to repo root
      var repoBase = pathSegments.length > 2 ? '/' + pathSegments[1] + '/' : '/';
      location.replace(repoBase);
    </script>
  </head>
  <body style="background-color: #13171a; color: #cba358; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">

  </body>
</html>
